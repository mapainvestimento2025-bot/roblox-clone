  <script>
/* auth.js - contas, amigos e mapas.
   Sem servidor: tudo fica no navegador (localStorage).
   Com `node server.js`: tudo é guardado no servidor (data.json) e compartilhado entre navegadores/PCs. */

/* SHA-256 em JS puro (usado quando crypto.subtle não existe, ex.: http://IP-da-rede) -> mesmo resultado em qualquer lugar */
function sha256hex(str) {
  const b = new TextEncoder().encode(str), l = b.length, pad = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  pad.set(b); pad[l] = 128; const dv0 = new DataView(pad.buffer); dv0.setUint32(pad.length - 4, (l * 8) >>> 0); dv0.setUint32(pad.length - 8, Math.floor(l * 8 / 2 ** 32));
  const K = [], H = []; let n = 2, c = 0;
  while (c < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; } if (p) { if (c < 8) H[c] = ((Math.sqrt(n) % 1) * 2 ** 32) | 0; K[c] = ((Math.cbrt(n) % 1) * 2 ** 32) | 0; c++; } n++; }
  const w = new Int32Array(64), rr = (x, s) => (x >>> s) | (x << (32 - s));
  for (let o = 0; o < pad.length; o += 64) {
    const dv = new DataView(pad.buffer, o, 64); for (let i = 0; i < 16; i++) w[i] = dv.getInt32(i * 4);
    for (let i = 16; i < 64; i++) { const a = w[i - 15], d = w[i - 2]; w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(d, 17) ^ rr(d, 19) ^ (d >>> 10))) | 0; }
    let [a, b2, c2, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b2) ^ (a & c2) ^ (b2 & c2))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b2; b2 = a; a = (t1 + t2) | 0; }
    [a, b2, c2, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

// Converte /api/rota ou /api/rota?param=val para /api/api.php?action=rota&param=val
function apiUrl(path) {
  const sep = path.indexOf('?');
  const route = sep >= 0 ? path.slice(5, sep) : path.slice(5); // remove '/api/'
  const query = sep >= 0 ? '&' + path.slice(sep + 1) : '';
  return '/api/api.php?action=' + route + query;
}

const Auth = {
  users() { try { return JSON.parse(localStorage.getItem('robloxUsers')) || {}; } catch (e) { return {}; } },
  save(u) { localStorage.setItem('robloxUsers', JSON.stringify(u)); },
  async hash(p) {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rbx:' + p));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { return sha256hex('rbx:' + p); }
  },
  /* Sessão POR ABA (sessionStorage): cada aba pode ter uma conta diferente.
     "Manter conectado" guarda uma cópia no localStorage só para reabrir o site depois. */
  tabKey() { const k = sessionStorage.getItem('robloxSession'); return k && this.users()[k] ? k : null; },
  tabUser() { const k = this.tabKey(); return k ? this.users()[k].name : null; },
  remembered() { const k = localStorage.getItem('robloxSession'), u = this.users()[k]; return u ? u.name : null; },
  current() {
    let k = this.tabKey();
    if (!k) { const r = localStorage.getItem('robloxSession'); if (r && this.users()[r]) { sessionStorage.setItem('robloxSession', r); k = r; } }
    return k ? this.users()[k].name : null;
  },
  setSession(key, remember) { sessionStorage.setItem('robloxSession', key); if (remember !== false) localStorage.setItem('robloxSession', key); },
  require() { const n = this.current(); if (!n) { location.href = 'login.html'; throw new Error('login necessário'); } return n; },
  async register(name, email, pass, remember) {
    name = name.trim(); const key = name.toLowerCase(), users = this.users();
    if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return 'Usuário: 3 a 20 letras, números ou _ (sem espaços).';
    if (!/^\S+@\S+\.\S+$/.test(email)) return 'Digite um e-mail válido.';
    if (pass.length < 6) return 'A senha precisa ter pelo menos 6 caracteres.';
    await this.init();
    if (this.server) {
      const h = await this.hash(pass);
      const d = await this.device(), j = await this.post('/api/register', { name, email, hash: h, hw: d.hw, dv: d.dv, mobile: d.mobile, info: d.info });
      if (j.err) return j.err;
      /* guarda o hash no cache local para garantir login mesmo sem servidor */
      const ux = this.users(); if (ux[key]) { ux[key].hash = h; this.save(ux); }
      this.setSession(key, remember); return null;
    }
    if (users[key]) return 'Esse nome de usuário já está em uso.';
    if (Object.values(users).some(u => u.email === email.toLowerCase())) return 'Esse e-mail já está cadastrado.';
    users[key] = { name, email: email.toLowerCase(), hash: await this.hash(pass), created: Date.now() };
    /* marca este usuário como pendente de upload para o servidor */
    if (!this._pendingImport) this._pendingImport = {};
    delete this._pendingImport[key];   // força importLocal() a enviá-lo quando servidor ligar
    this._init = null;                 // força init() a rodar de novo para tentar subir para o servidor
    this.save(users); this.setSession(key, remember); return null;
  },
  async login(name, pass, remember) {
    const key = name.trim().toLowerCase(); await this.init();
    const h = await this.hash(pass);
    if (this.server) {
      const d = await this.device(), j = await this.post('/api/login', { name, hash: h, hw: d.hw, dv: d.dv, mobile: d.mobile, info: d.info });
      if (!j.err) {
        /* login no servidor ok: guarda hash local para funcionar offline depois */
        const users = this.users(); if (users[key]) { users[key].hash = h; this.save(users); }
        this.setSession(key, remember); return null;
      }
      /* servidor rejeitou — tenta autenticação local como fallback
         (cobre o caso de conta criada localmente antes do servidor subir) */
      const uLocal = this.users()[key];
      if (uLocal && uLocal.hash && uLocal.hash === h) {
        /* conta existe localmente com senha correta: sobe para o servidor agora */
        const d2 = await this.device();
        await this.post('/api/register', { name: uLocal.name, email: uLocal.email || '', hash: h, hw: d2.hw, dv: d2.dv, mobile: d2.mobile, info: d2.info });
        const users = this.users(); if (users[key]) { users[key].hash = h; this.save(users); }
        this.setSession(key, remember); return null;
      }
      return j.err;
    }
    const u = this.users()[key];
    if (!u) return 'Conta não encontrada neste dispositivo. Inicie o servidor (node server.js) para recuperar sua conta.';
    if (u.hash !== h) return 'Usuário ou senha incorretos.';
    this.setSession(key, remember); return null;
  },
  /* ---- identificação do dispositivo (HWID — nível hardware/mobile) ----
     PC:     WebGL GPU, Canvas pixel hash, AudioContext, fontes, CPU/RAM/tela
     Mobile: todos os acima + modelo do aparelho (userAgent), resolução física (identifica
             modelo exato do celular), sensores, toque, "Android ID" equivalente derivado do
             fingerprint de hardware + MAC address via WebRTC (quando disponível)
     hw  = impressão digital do hardware — estável, difícil de mudar
     dv  = UUID persistente em 7 camadas — sobrevive a reinstalação do app/browser/limpeza
     Ban bate se hw OU dv bater; criar nova conta no mesmo aparelho também é bloqueado. */
  device() {
    return this._dev || (this._dev = (async () => {
      const sha = async s => { try { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return sha256hex(s); } };

      /* ── 1. WebGL GPU: vendor + renderer + parâmetros (identifica chip gráfico do celular) ─── */
      let gl = '';
      try {
        const c = document.createElement('canvas'), g = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
        if (g) {
          const x = g.getExtension('WEBGL_debug_renderer_info');
          /* No celular retorna coisas como "Qualcomm||Adreno (TM) 740" ou "Apple||Apple M2" */
          gl = x ? (g.getParameter(x.UNMASKED_VENDOR_WEBGL) + '||' + g.getParameter(x.UNMASKED_RENDERER_WEBGL))
                 : (g.getParameter(g.VENDOR) + '||' + g.getParameter(g.RENDERER));
          gl += '||' + [g.getParameter(g.MAX_TEXTURE_SIZE), g.getParameter(g.MAX_COMBINED_TEXTURE_IMAGE_UNITS),
                        g.getParameter(g.MAX_VERTEX_ATTRIBS), g.getParameter(g.MAX_RENDERBUFFER_SIZE)].join(',');
          /* extensões suportadas — variam por GPU/driver — muito estável */
          try { const ext = g.getSupportedExtensions(); if (ext) gl += '||' + ext.slice().sort().join(','); } catch(_) {}
        }
      } catch (e) {}

      /* ── 2. Canvas 2D: pixel hash — muda por GPU, driver e renderizador de fonte ─────────── */
      let cv = '';
      try {
        const c = document.createElement('canvas'); c.width = 300; c.height = 70;
        const x = c.getContext('2d');
        const g = x.createLinearGradient(0, 0, 300, 0); g.addColorStop(0, '#f60'); g.addColorStop(0.5, '#0f0'); g.addColorStop(1, '#069');
        x.fillStyle = g; x.fillRect(0, 0, 300, 70);
        x.shadowBlur = 6; x.shadowColor = '#333';
        x.font = 'bold 20px Arial, Helvetica, sans-serif'; x.fillStyle = 'rgba(10,200,100,0.88)';
        x.fillText('RbxClone🎮fingerprint©', 5, 26);
        x.font = 'italic 14px Georgia, serif'; x.fillStyle = 'rgba(255,255,255,0.9)';
        x.fillText('HWID·Mobile·Ban·2026', 5, 50);
        /* arc + bezier — comportamento varia por motor de renderização */
        x.beginPath(); x.arc(270, 35, 22, 0, Math.PI * 2); x.strokeStyle = 'rgba(255,80,80,0.7)'; x.lineWidth = 3; x.stroke();
        cv = c.toDataURL('image/png');
      } catch (e) {}

      /* ── 3. AudioContext: soma de amostras — varia por chip de áudio / driver ──────────── */
      let au = '';
      try {
        const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
        const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 10000;
        const comp = ctx.createDynamicsCompressor();
        [['threshold', -50],['knee', 40],['ratio', 12],['attack', 0],['release', 0.25]].forEach(([p,v]) => { try { comp[p].value = v; } catch(_){} });
        osc.connect(comp); comp.connect(ctx.destination); osc.start(0);
        const buf = await ctx.startRendering(), data = buf.getChannelData(0); let sum = 0;
        for (let i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
        au = sum.toFixed(10);
      } catch (e) {}

      /* ── 4. Fontes instaladas via Canvas (no mobile muda entre Android/iOS/MIUI/etc.) ───── */
      let fontSig = '';
      try {
        const probe = document.createElement('canvas'); probe.width = 500; probe.height = 100;
        const px = probe.getContext('2d'); const T = 'mmwwlliiBBII1234!@#$';
        const FONTS = ['Arial','Times New Roman','Courier New','Georgia','Verdana','Tahoma','Trebuchet MS','Impact',
                       'Palatino','Garamond','Comic Sans MS','Calibri','Segoe UI','Consolas','Lucida Console',
                       /* fonts comuns no Android/iOS: */
                       'Roboto','Noto Sans','San Francisco','SF Pro','Helvetica Neue','PingFang SC','Hiragino Sans'];
        px.font = '72px monospace'; const bw = px.measureText(T).width;
        fontSig = FONTS.map(f => { px.font = '72px "' + f + '", monospace'; return px.measureText(T).width !== bw ? '1' : '0'; }).join('');
      } catch (e) {}

      /* ── 5. MAC address via WebRTC (candidatos ICE — disponível em Android Chrome/Firefox) ─ */
      /* Navegadores modernos mascaram o MAC, mas o IP local + tempo de resposta ainda varia */
      let rtcSig = '';
      try {
        await new Promise(res => {
          const pc = new RTCPeerConnection({ iceServers: [] });
          pc.createDataChannel('');
          pc.createOffer().then(o => pc.setLocalDescription(o));
          const timer = setTimeout(() => { try { pc.close(); } catch(_){} res(); }, 600);
          pc.onicecandidate = e => {
            if (!e || !e.candidate) return;
            /* extrai IP local (192.168.x.x / 10.x / fe80::) — estável na mesma rede wi-fi */
            const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}|[0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,}/gi);
            if (m) { rtcSig = m.filter(ip => /^(192\.168|10\.|172\.(1[6-9]|2\d|3[01])\.|fe80)/i.test(ip)).join(','); clearTimeout(timer); try { pc.close(); } catch(_){} res(); }
          };
        });
      } catch (e) {}

      /* ── 6. Modelo do aparelho + sinais exclusivos de mobile ─────────────────────────────── */
      const n = navigator, uaRaw = n.userAgent || '';
      /* extrai modelo legível do userAgent:
         Android: "Mozilla/5.0 (Linux; Android 14; SM-G998B Build/...)" → "Samsung SM-G998B (Android 14)"
         iPhone:  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 ...)"        → "iPhone (iOS 17.0)"
         iPad:    "Mozilla/5.0 (iPad; CPU OS 16_0 ...)"                 → "iPad (iPadOS 16.0)"
         Win PC:  "Mozilla/5.0 (Windows NT 10.0; Win64; x64 ...)"       → "Windows 10 x64"
         Mac:     "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7 ...)" → "Mac OS X 10.15.7"  */
      let deviceModel = '—';
      try {
        const inner = (uaRaw.match(/\(([^)]+)\)/) || ['',''])[1];
        if (/Android/i.test(uaRaw)) {
          const ver  = (uaRaw.match(/Android\s*([\d.]+)/i) || ['',''])[1];
          /* modelo: último token após o último ";" antes de "Build" ou fim */
          const mdl  = inner.replace(/Build\/[^;)]+/g,'').split(';').map(s=>s.trim()).filter(Boolean).pop() || '';
          deviceModel = (mdl ? mdl + ' ' : '') + (ver ? '(Android ' + ver + ')' : '');
        } else if (/iPhone/i.test(uaRaw)) {
          const ver = (uaRaw.match(/OS\s*([\d_]+)/i) || ['',''])[1].replace(/_/g,'.');
          deviceModel = 'iPhone' + (ver ? ' (iOS ' + ver + ')' : '');
        } else if (/iPad/i.test(uaRaw)) {
          const ver = (uaRaw.match(/OS\s*([\d_]+)/i) || ['',''])[1].replace(/_/g,'.');
          deviceModel = 'iPad' + (ver ? ' (iPadOS ' + ver + ')' : '');
        } else if (/Windows/i.test(uaRaw)) {
          const nt = (uaRaw.match(/Windows NT\s*([\d.]+)/i) || ['',''])[1];
          const ntMap = {'10.0':'10/11','6.3':'8.1','6.2':'8','6.1':'7','6.0':'Vista'};
          const arch = /Win64|x64/i.test(uaRaw) ? ' x64' : /WOW64/i.test(uaRaw) ? ' x86_64' : '';
          deviceModel = 'Windows ' + (ntMap[nt] || nt) + arch;
        } else if (/Macintosh|Mac OS/i.test(uaRaw)) {
          const ver = (uaRaw.match(/Mac OS X\s*([\d_.]+)/i) || ['',''])[1].replace(/_/g,'.');
          deviceModel = 'Mac OS X ' + ver;
        } else if (/Linux/i.test(uaRaw)) {
          deviceModel = 'Linux';
        } else {
          deviceModel = inner.replace(/Build\/[^;)]+/g,'').split(';').map(s=>s.trim()).filter(Boolean).slice(0,2).join('; ');
        }
        deviceModel = deviceModel.trim() || '—';
      } catch(_) {}
      /* versão bruta estável para o hash (números de versão de SO removidos, modelo mantido) */
      const deviceModelStable = deviceModel.replace(/\d+\.\d+(\.\d+)?/g, 'N');
      /* resolução física real — identifica modelo exato do celular (ex: 1080×2400 = Samsung A54) */
      const dpr = Math.round((window.devicePixelRatio || 1) * 100);
      const physW = Math.round(screen.width  * (window.devicePixelRatio || 1));
      const physH = Math.round(screen.height * (window.devicePixelRatio || 1));
      const sysInfo = [
        n.hardwareConcurrency || 0,    // núcleos de CPU (Snapdragon 8 Gen 3 = 8)
        n.deviceMemory || 0,           // RAM em GB
        deviceModelStable,             // modelo estável sem versões de SO
        uaRaw.replace(/[\d.]+/g,'N'),  // userAgent estável
        n.language || '',
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen.width + 'x' + screen.height,
        physW + 'x' + physH,           // resolução física (identifica modelo do celular)
        screen.colorDepth || 0,
        dpr,
        n.maxTouchPoints || 0,         // 0=mouse/PC, 1=stylus, 5=touch, 10=multitouch
        n.platform || '',
        !!(window.DeviceOrientationEvent || window.DeviceMotionEvent) ? '1' : '0', // tem sensores
        'vibrate' in n ? '1' : '0',    // motor de vibração (só mobile)
        'share' in n ? '1' : '0',      // Web Share API (só mobile/PWA)
        typeof window.ontouchstart !== 'undefined' ? '1' : '0',
        (n.connection && n.connection.effectiveType) || '',  // '4g'|'wifi'|'3g'
        rtcSig,                        // IP local da rede (estável na mesma rede)
      ];

      /* hw = "Android ID" equivalente — derivado de hardware+tela+GPU+áudio+fontes */
      const hw = await sha(JSON.stringify({ gl, cv, au, fontSig, sys: sysInfo }));

      /* ── 7. UUID persistente em 7 camadas ─────────────────────────────────────────────────
            Cada camada pode falhar independentemente em mobile (iOS Safari modo privado,
            Android limpeza de dados de app, etc).  Lemos todas em paralelo e usamos a
            primeira válida.  Ao gravar, persistimos em todas as 7 ao mesmo tempo.
            Camadas: localStorage · sessionStorage · cookie (10 anos) · IndexedDB ·
                     Cache Storage (Service Worker cache) · opaque localStorage key ·
                     "Android ID" derivado do hw (fallback determinístico)              */
      const IDB_KEY = 'rbxhwid_v3';
      const idb = (mode, val) => new Promise(res => {
        try {
          const r = indexedDB.open('rbxdevice', 3);
          r.onupgradeneeded = e => { try { if (!e.target.result.objectStoreNames.contains('k')) e.target.result.createObjectStore('k'); } catch(_){} };
          r.onerror = () => res(null);
          r.onsuccess = () => { try {
            const tx = r.result.transaction('k', mode==='set'?'readwrite':'readonly'), st = tx.objectStore('k');
            if (mode==='set') { st.put(val, IDB_KEY); tx.oncomplete = () => res(val); tx.onerror = () => res(null); }
            else { const q = st.get(IDB_KEY); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); }
          } catch(_){ res(null); } };
        } catch(e){ res(null); }
      });
      const cacheStore = async (mode, val) => {
        try {
          if (!('caches' in window)) return null;
          const c = await caches.open('rbx-device-v2');
          if (mode==='set') { await c.put('/__rbxhwid', new Response(val, { headers:{'Content-Type':'text/plain'} })); return val; }
          const r = await c.match('/__rbxhwid'); return r ? (await r.text()).trim() : null;
        } catch(e){ return null; }
      };
      /* lê todas as camadas em paralelo */
      let ls=null, ss=null; try { ls=localStorage.getItem('rbxDv3'); } catch(e){}
      try { ss=sessionStorage.getItem('rbxDv3'); } catch(e){}
      const ckM = document.cookie.match(/(?:^|; )rbxhwid3=([a-f0-9]{32})/);
      const ck = ckM ? ckM[1] : null;
      /* chave alternativa — nome diferente para resistir a limpezas seletivas */
      let ls2=null; try { ls2=localStorage.getItem('_rbx_d'); } catch(e){}
      const [idbVal, cacheVal] = await Promise.all([idb('get'), cacheStore('get')]);
      /* "Android ID" derivado: se nada sobrou, o hw é determinístico — usamos os primeiros 32 chars como fallback */
      const hwFallback = hw.slice(0, 32);
      let dv = [ls, ss, ck, ls2, idbVal, cacheVal].find(v => v && /^[a-f0-9]{32}$/.test(v));
      /* se não achou nenhum UUID salvo, verifica se o hw bate com algum ban antes de gerar novo */
      if (!dv) dv = hwFallback; /* usa hw como dv inicial — garante que o mesmo aparelho sem storage também é identificado */
      const isNewDv = ![ls, ss, ck, ls2, idbVal, cacheVal].some(v => v && /^[a-f0-9]{32}$/.test(v));
      if (isNewDv) {
        /* gera UUID aleatório real apenas se não havia nenhum armazenado */
        dv = [...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
      }
      /* persiste nas 7 camadas em paralelo */
      await Promise.all([
        (async()=>{ try { localStorage.setItem('rbxDv3', dv); localStorage.setItem('_rbx_d', dv); } catch(e){} })(),
        (async()=>{ try { sessionStorage.setItem('rbxDv3', dv); } catch(e){} })(),
        (async()=>{ try { document.cookie='rbxhwid3='+dv+';max-age=315360000;path=/;SameSite=Lax'; } catch(e){} })(),
        idb('set', dv),
        cacheStore('set', dv),
      ]);
      /* migra chaves legadas */
      try { ['rbxDv','rbxDv2'].forEach(k => { const v=localStorage.getItem(k); if(v) localStorage.removeItem(k); }); } catch(e){}
      const mobile = /Android|iPhone|iPad|iPod|Mobile|Tablet|BlackBerry|IEMobile|Opera Mini/i.test(uaRaw)
                   || (n.maxTouchPoints > 1 && !/Win/i.test(n.platform));
      /* info legível para o admin ver no painel */
      const info = {
        model: deviceModel,                                        // ex: "SM-G998B (Android 14)" ou "Windows 10 x64"
        ua: uaRaw.slice(0, 200),                                   // userAgent truncado
        res: physW + 'x' + physH,                                  // resolução física real
        dpr: (window.devicePixelRatio || 1).toFixed(2),
        cpu: n.hardwareConcurrency || 0,
        ram: n.deviceMemory || 0,
        lang: n.language || '',
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        touch: n.maxTouchPoints || 0,
        platform: n.platform || '',
        conn: (n.connection && n.connection.effectiveType) || '',
        gpu: gl.split('||').slice(0,2).join(' / ').slice(0, 80),   // "Qualcomm / Adreno (TM) 740"
        localIp: rtcSig || '',
      };
      /* retorna hw (fingerprint de hardware) E dv (UUID persistente) — o servidor bane qualquer um dos dois */
      return { hw, dv, mobile, info };
    })());
  },

  /* ---- jogadores online por mapa (tempo real entre abas) ---- */
  presence: {
    KEY: 'robloxPresence', TTL: 75000, /* abas em segundo plano são desaceleradas pelo navegador */ server: false, cache: {},
    /* init(): tenta usar o server.js; se não existir, usa o localStorage (só abas do mesmo navegador/endereço) */
    async init() { try { const r = await fetch(apiUrl('/api/presence'), { cache: 'no-store' }); if (r.ok && (r.headers.get('content-type') || '').includes('json')) { this.cache = await r.json(); this.server = true; } } catch (e) {} return this.server; },
    async sync() { if (!this.server) return; try { this.cache = await (await fetch(apiUrl('/api/presence'), { cache: 'no-store' })).json(); } catch (e) {} },
    readLocal() { try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { return {}; } },
    clean(p) { const now = Date.now(); for (const m in p) { for (const u in p[m]) if (now - p[m][u] > this.TTL) delete p[m][u]; if (!Object.keys(p[m]).length) delete p[m]; } return p; },
    post(path, map, user) { const body = JSON.stringify({ map, user }); try { if (path === 'leave' && navigator.sendBeacon) return navigator.sendBeacon(apiUrl('/api/presence/leave'), new Blob([body], { type: 'application/json' })); } catch (e) {} return fetch(apiUrl('/api/presence/' + path), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {}); },
    beat(map, user) {

      const p = this.clean(this.readLocal()); (p[map] = p[map] || {})[user] = Date.now(); localStorage.setItem(this.KEY, JSON.stringify(p));
    },
    leave(map, user) {

    /* ---- vários servidores por mapa (cada um com sua própria lotação) ----

  /* ---- chat do mapa + bate-papo privado (servidor: server.js; sem servidor: localStorage, só abas do mesmo navegador) ---- */
  chat: {
    async _j(rawUrl, body) {                              // sempre devolve objeto; erro vem em .err (nunca falha em silêncio)
      try {
        const r = await fetch(apiUrl(rawUrl), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
        if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return { ok: false, old: true };   // servidor antigo (sem rotas de chat)

  dn(n) { return this.users()[n.toLowerCase()].name; },
  has(l, n) { return l.some(x => x.toLowerCase() === n.toLowerCase()); },
  without(l, n) { return l.filter(x => x.toLowerCase() !== n.toLowerCase()); },
  friends(n) { return this._get('robloxFriends:' + n.toLowerCase()); },
  requests(n) { return this._get('robloxReq:' + n.toLowerCase()); }, /* pedidos recebidos */
  status(me, o) {
    if (this.has(this.friends(me), o)) return 'friends';
    if (this.has(this.requests(o), me)) return 'sent';
    if (this.has(this.requests(me), o)) return 'received';
    return 'none';
  },
  sendRequest(me, o) { const l = this.requests(o); if (!this.has(l, me)) { l.push(this.dn(me)); this._set('robloxReq:' + o.toLowerCase(), l); } if (this.server) this.post('/api/friend', { op: 'request', me, other: o }); },
  accept(me, from) {
    if (this.server) this.post('/api/friend', { op: 'accept', me, other: from });
    this._set('robloxReq:' + me.toLowerCase(), this.without(this.requests(me), from));
    [[me, from], [from, me]].forEach(([a, b]) => { const f = this.friends(a); if (!this.has(f, b)) { f.push(this.dn(b)); this._set('robloxFriends:' + a.toLowerCase(), f); } });
  },
  decline(me, from) { if (this.server) this.post('/api/friend', { op: 'decline', me, other: from }); this._set('robloxReq:' + me.toLowerCase(), this.without(this.requests(me), from)); },
  unfriend(me, o) { if (this.server) this.post('/api/friend', { op: 'unfriend', me, other: o }); [[me, o], [o, me]].forEach(([a, b]) => this._set('robloxFriends:' + a.toLowerCase(), this.without(this.friends(a), b))); }
};

/* ---- Online / jogando / visto por último (todas as páginas) ----
   Amigos veem "Jogando: <mapa>"; quem não é amigo só vê "Online". Só funciona com o node server.js. */
Auth.pres = {
  cache: {}, timer: null,
  last(ts) {                                    // "visto hoje às 14:05" · "visto ontem às 22:10" · "visto por último em 20/10/2026 às 09:30"
    if (!ts) return 'Offline';
    const d = new Date(ts), n = new Date(), y = new Date(Date.now() - 864e5), same = (a, b) => a.toDateString() === b.toDateString();
    const h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return same(d, n) ? 'visto hoje às ' + h : same(d, y) ? 'visto ontem às ' + h : 'visto por último em ' + d.toLocaleDateString('pt-BR') + ' às ' + h;
  },
  get(u) { return this.cache[(u || '').toLowerCase()] || null; },
  /* { k:'play'|'on'|'off', t:texto, g:mapa } — texto sem HTML */
  info(u) {
    const p = this.get(u); if (!p) return { k: 'off', t: 'Offline' };
    if (p.g) return { k: 'play', t: 'Jogando: ' + p.g, g: p.g };
    if (p.on) return { k: 'on', t: 'Online' };
    return { k: 'off', t: p.s ? this.last(p.s) : 'Offline' };
  },
  COLOR: { play: '#00b06f', on: '#3b82f6', off: '#6b7280' },
  async fetch(names) {
    const me = Auth.current(); if (!me || !Auth.server || !names.length) return false;
    try { const r = await fetch(apiUrl('/api/status?me=' + encodeURIComponent(me) + '&users=' + encodeURIComponent(names.join(','))), { cache: 'no-store' }); if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return false;
      const j = await r.json(); for (const k in j) this.cache[k.toLowerCase()] = j[k]; return true; } catch (e) { return false; }
  },
  watch(getNames, cb) {                         // atualiza a cada 4s e chama cb()
    const run = async () => { if (await this.fetch([].concat(getNames()))) cb(); };
    run(); setInterval(run, 4000);
  },
  async ping() { const me = Auth.current(); if (!me || !Auth.server) return; const d = await Auth.device(); try { const j = await (await fetch(apiUrl('/api/ping'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: me, hw: d.hw, dv: d.dv, mobile: d.mobile, info: d.info }), keepalive: true })).json(); if (j.ban) Auth.showBan(j.ban); } catch (e) {} },
  start() { if (this.timer) return; this.ping(); this.timer = setInterval(() => this.ping(), 10000); document.addEventListener('visibilitychange', () => { if (!document.hidden) this.ping(); }); }
};
/* Expõe Auth globalmente para funcionar tanto como script externo quanto inline */
window.Auth = Auth;
(function () { const go = () => { try { Auth.init().then(on => { if (!on) return; Auth.deviceCheck(); if (Auth.current()) Auth.pres.start(); }); } catch (e) {} }; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go(); })();

(function(){
  // Aguarda auth.js estar disponível (até 5s) antes de redirecionar
  if (typeof Auth !== 'undefined' && typeof Auth.init === 'function') return;

    tries++;

<script>
const $ = id => document.getElementById(id);
const ME = Auth.require();

/* ============================================================
   CRIPTOGRAFIA DE PONTA A PONTA (E2EE)
   - Chave AES-GCM-256 derivada dos nomes dos dois participantes
     via PBKDF2 (SHA-256, 100.000 iterações)
   - Só quem conhece os dois nomes consegue decifrar
   - O servidor nunca vê o conteúdo em texto claro
   ============================================================ */
const E2E = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const pairSeed = (a, b) => [a.trim().toLowerCase(), b.trim().toLowerCase()].sort().join(':');
  const keyCache = {};
  async function getKey(userA, userB) {
    const seed = pairSeed(userA, userB);
    if (keyCache[seed]) return keyCache[seed];
    const raw = await crypto.subtle.importKey('raw', enc.encode(seed), 'PBKDF2', false, ['deriveKey']);
    const salt = enc.encode('rbxe2e:' + seed);
    const k = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 100000 },
      raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
    keyCache[seed] = k; return k;
  }
  async function encrypt(text, userA, userB) {
    try {
      const k = await getKey(userA, userB);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(text));
      return 'e2e:' + b64e(iv) + ':' + b64e(ct);
    } catch { return text; } // fallback: texto puro se WebCrypto indisponível
  }
  async function decrypt(data, userA, userB) {
    if (!data || !data.startsWith('e2e:')) return data;
    try {
      const parts = data.split(':'); if (parts.length < 3) return data;
      const iv = b64d(parts[1]), ct = b64d(parts.slice(2).join(':'));
      const k = await getKey(userA, userB);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct);
      return dec.decode(pt);
    } catch { return '🔒 [mensagem criptografada — abra no mesmo navegador]'; }
  }
  return { encrypt, decrypt, pairSeed };
})();
$('hdrUser').textContent = ME; $('hdrUser').onclick = () => location.href = Auth.profileUrl(ME);
let cur = null, summary = {}, lastKey = '';
const circ = (n, size) => { const d = document.createElement('div'); d.className = 'rounded-full flex items-center justify-center font-black shrink-0 text-[#222]'; d.style.cssText = `width:${size}px;height:${size}px;background:${Auth.avatar(n).head};font-size:${size / 2.4}px`; d.textContent = n[0].toUpperCase(); return d; };
const SV1 = '<svg viewBox="0 0 16 15" width="16" height="15"><path d="M11.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-2.405-2.272a.463.463 0 0 0-.336-.136.47.47 0 0 0-.362.159.508.508 0 0 0 .01.682l2.76 2.612a.5.5 0 0 0 .353.138.5.5 0 0 0 .364-.19l6.51-8.04a.47.47 0 0 0-.019-.665z"/></svg>';
const SV2 = '<svg viewBox="0 0 16 15" width="16" height="15"><path d="M11.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-2.405-2.272a.463.463 0 0 0-.336-.136.47.47 0 0 0-.362.159.508.508 0 0 0 .01.682l2.76 2.612a.5.5 0 0 0 .353.138.5.5 0 0 0 .364-.19l6.51-8.04a.47.47 0 0 0-.019-.665z"/><path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512z"/></svg>';
/* selos: sent = 1 cinza (amigo offline) · delivered = 2 cinzas (amigo online, não leu) · read = 2 azuis (leu) */
function tickEl(state) { const s = document.createElement('span'); s.className = 'tk ' + state; s.title = { sent: 'Enviada', delivered: 'Entregue', read: 'Lida' }[state] || ''; s.innerHTML = state === 'sent' ? SV1 : SV2; return s; }

function dayLabel(t) { const d = new Date(t), n = new Date(), y = new Date(Date.now() - 864e5); const same = (a, b) => a.toDateString() === b.toDateString(); return same(d, n) ? 'Hoje' : same(d, y) ? 'Ontem' : d.toLocaleDateString('pt-BR'); }

/* ---- lista de amigos / conversas ---- */
function renderList() {
  const q = $('fq').value.trim().toLowerCase(), box = $('convs');
  let fr = Auth.friends(ME).filter(n => n.toLowerCase().includes(q));
  fr.sort((a, b) => ((summary[b] || {}).t || 0) - ((summary[a] || {}).t || 0) || a.localeCompare(b));
  const unread = Auth.chat.unread(ME, summary);
  $('cnt').textContent = Auth.friends(ME).length + ' amigo(s)';
  $('noFriends').classList.toggle('hidden', !!Auth.friends(ME).length);
  box.innerHTML = '';
  if (!fr.length) box.innerHTML = '<p class="text-center text-gray-500 py-10 px-4">' + (q ? 'Nenhum amigo encontrado.' : 'Sem amigos por enquanto.') + '</p>';
  fr.forEach(n => {
    const last = summary[n], isU = unread.includes(n), row = document.createElement('div');
    row.className = 'flex items-center gap-3 px-4 py-3 cursor-pointer si ' + (cur && cur.toLowerCase() === n.toLowerCase() ? 'bg-white/10' : '');
    const mid = document.createElement('div'); mid.className = 'flex-1 min-w-0';
    mid.innerHTML = '<div class="flex items-center justify-between gap-2"><span class="font-bold truncate nm"></span><span class="text-[11px] text-gray-500 shrink-0 tm"></span></div><div class="text-xs truncate pv"></div>';
    mid.querySelector('.nm').textContent = n;
    mid.querySelector('.tm').textContent = last ? hhmm(last.t) : '';
    const pv = mid.querySelector('.pv'); pv.className += isU ? ' text-white font-semibold' : ' text-gray-400';
    if (last && last.u.toLowerCase() === ME.toLowerCase()) pv.appendChild(tickEl(last.ts || 'sent'));
    pv.append(last ? last.m : 'Toque para conversar');
    const av = circ(n, 44), pi = Auth.pres.info(n); av.style.position = 'relative';
    if (pi.k !== 'off') av.insertAdjacentHTML('beforeend', '<span style="position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2px solid #232527;background:' + Auth.pres.COLOR[pi.k] + '"></span>');
    row.append(av, mid);

    row.onclick = () => openConv(n); box.appendChild(row);
  });
}

/* ---- conversa aberta ---- */
function openConv(n) {
  cur = Auth.friends(ME).find(x => x.toLowerCase() === n.toLowerCase());
  if (!cur) return; lastKey = ''; clearReply();
  history.replaceState(null, '', 'batepapo.html?u=' + encodeURIComponent(cur));
  $('empty').classList.add('hidden'); $('conv').classList.remove('hidden'); $('conv').classList.add('flex');
  $('chatPane').classList.remove('hidden'); $('listPane').classList.add('hidden', 'md:flex');
  $('cAv').innerHTML = ''; $('cAv').appendChild(circ(cur, 36));
  $('cName').innerHTML = ''; $('cName').append(cur); $('cName').insertAdjacentHTML('beforeend', ' ' + Auth.badge(cur)); $('cName').onclick = () => location.href = Auth.profileUrl(cur);
  setStatus(null, cur);
  $('msgs').innerHTML = ''; renderList(); loadMsgs(true); $('inp').focus();
}
function closeConv() {
  cur = null; history.replaceState(null, '', 'batepapo.html');
  $('conv').classList.add('hidden'); $('conv').classList.remove('flex'); $('empty').classList.remove('hidden');
  $('chatPane').classList.add('hidden'); $('listPane').classList.remove('hidden'); renderList();
}
async function loadMsgs(force) {
  if (!cur) return; const who = cur, R = await Auth.chat.dmGet(ME, who, document.visibilityState === 'visible'), l = R.msgs, st = R.st || {};
  if (!cur || cur !== who) return;
  lastSt = st; setStatus(st, who);
  /* descriptografar todas as mensagens */
  for (const m of l) {
    if (!m._dec) { m._plain = await E2E.decrypt(m.m, ME, who); m._dec = true; }
    if (m.r && !m.r._dec) { m.r._plain = await E2E.decrypt(m.r.m, ME, who); m.r._dec = true; }
  }
  const mineT = m => m.u.toLowerCase() === ME.toLowerCase(), sig = l.filter(mineT).map(m => Auth.chat.tick(m, st)[0]).join('');
  const k = l.length + '|' + (l.length ? l[l.length - 1].t : 0) + '|' + sig; if (!force && k === lastKey) return;
  checkOld(); lastKey = k; const box = $('msgs'), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || force;
  box.innerHTML = ''; let day = '';
  if (!l.length) box.innerHTML = '<p class="text-center text-gray-500 mt-10">Diga oi para <b></b>! 👋</p>', box.querySelector('b').textContent = who;
  let prev = null;
  l.forEach(m => {
    const plainText = m._plain || m.m;
    const dl = dayLabel(m.t); if (dl !== day) { day = dl; prev = null; box.insertAdjacentHTML('beforeend', '<div class="text-center text-[11px] text-gray-500 py-2"></div>'); box.lastChild.textContent = dl; }
    const mine = m.u.toLowerCase() === ME.toLowerCase(), grouped = prev && prev.u === m.u && m.t - prev.t < 120000; prev = m;
    const row = document.createElement('div'); row.className = 'mrow ' + (mine ? 'mine ' : '') + (grouped ? 'g' : 'mt-2'); row.dataset.t = m.t; row.dataset.u = m.u;
    const bub = document.createElement('div'); bub.className = 'bub ' + (mine ? 'me' : 'ot'); bub.title = hhmm(m.t);
    if (m.r) {   // citação da mensagem respondida
      const q = document.createElement('div'); q.className = 'qt'; q.innerHTML = '<div class="qn"></div><div class="qm"></div>';
      q.firstChild.textContent = m.r.u.toLowerCase() === ME.toLowerCase() ? 'Você' : m.r.u; q.lastChild.textContent = m.r._plain || m.r.m;
      q.onclick = e => { e.stopPropagation(); jumpTo(m.r.u, m.r.t); }; bub.appendChild(q);
    }
    /* ícone de cadeado para mensagens E2EE */
    const isEnc = m.m && m.m.startsWith('e2e:');
    bub.appendChild(document.createTextNode(plainText));
    const tm = document.createElement('span'); tm.className = 'block text-[10px] opacity-60 mt-0.5 text-right'; tm.textContent = hhmm(m.t);
    if (isEnc) tm.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-lock text-[8px] opacity-40" title="Criptografada E2EE"></i>');
    if (mine) tm.appendChild(tickEl(Auth.chat.tick(m, st))); bub.appendChild(tm);
    const acts = document.createElement('div'); acts.className = 'acts';
    const mk = (ic, title, fn) => { const x = document.createElement('button'); x.type = 'button'; x.className = 'act'; x.title = title; x.innerHTML = '<i class="fa-solid fa-' + ic + '"></i>'; x.onclick = e => { e.stopPropagation(); fn(x); }; return x; };
    acts.append(mk('reply', 'Responder', () => setReply({ ...m, m: plainText })), mk('copy', 'Copiar', x => copyTxt(plainText, x)));
    row.append(bub, acts);
    row.ondblclick = () => setReply({ ...m, m: plainText });
    bub.onclick = () => { if (matchMedia('(hover:none)').matches) { const was = row.classList.contains('show'); document.querySelectorAll('.mrow.show').forEach(r => r.classList.remove('show')); if (!was) row.classList.add('show'); } };
    swipe(row, { ...m, m: plainText }); box.appendChild(row);
  });
  if (atEnd) box.scrollTop = box.scrollHeight;
  if (l.length) { Auth.chat.markSeen(ME, who, l[l.length - 1].t); const lm = l[l.length - 1]; summary[who] = mineT(lm) ? Object.assign({}, lm, { ts: Auth.chat.tick(lm, st), m: lm._plain || lm.m }) : { ...lm, m: lm._plain || lm.m }; renderList(); }
}
function setStatus(st, who) {   // "online" · "Jogando: mapa" (só amigos) · "visto hoje/ontem/dd/mm/aaaa às hh:mm"
  const e = $('cSub'), P = Auth.pres.get(who), pi = P && (P.on || P.g || P.s || !(st && (st.online || st.s))) ? Auth.pres.info(who) : (st && st.online ? { k: 'on', t: 'Online' } : st && st.s ? { k: 'off', t: Auth.pres.last(st.s) } : { k: 'off', t: '@' + who.toLowerCase() });
  e.innerHTML = pi.k === 'off' ? '' : '<i class="fa-solid fa-circle text-[7px] align-middle mr-1"></i>'; e.append(pi.t);
  e.className = 'text-xs truncate'; e.style.color = pi.k === 'off' ? '#8a8f95' : Auth.pres.COLOR[pi.k];
}
/* ---- responder mensagem ---- */
let replyTo = null, lastSt = null;
function setReply(m) {
  replyTo = { u: m.u, m: m.m.slice(0, 100), t: m.t };
  $('rbName').textContent = 'Respondendo a ' + (m.u.toLowerCase() === ME.toLowerCase() ? 'você mesmo' : m.u); $('rbText').textContent = m.m;
  $('replyBar').classList.remove('hidden'); $('replyBar').classList.add('flex'); $('inp').focus();
  document.querySelectorAll('.mrow.show').forEach(r => r.classList.remove('show'));
}
function clearReply() { replyTo = null; $('replyBar').classList.add('hidden'); $('replyBar').classList.remove('flex'); }
function jumpTo(u, t) {
  const r = [...document.querySelectorAll('.mrow')].find(x => x.dataset.t == t && x.dataset.u === u); if (!r) return;
  r.scrollIntoView({ behavior: 'smooth', block: 'center' }); r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 1400);
}
function copyTxt(t, btn) {
  const ok = () => { const i = btn.firstChild; i.className = 'fa-solid fa-check'; setTimeout(() => i.className = 'fa-solid fa-copy', 1100); };
  try { navigator.clipboard.writeText(t).then(ok, ok); } catch (e) { ok(); }
}
function swipe(row, m) {   // celular: arrastar a mensagem para a direita = responder
  let x0 = 0, y0 = 0, dx = 0, on = false;
  row.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = true; }, { passive: true });
  row.addEventListener('touchmove', e => { if (!on) return; const t = e.touches[0]; dx = t.clientX - x0; if (Math.abs(t.clientY - y0) > Math.abs(dx) || dx < 0) { dx = 0; row.style.transform = ''; return; } row.style.transform = 'translateX(' + Math.min(dx, 70) + 'px)'; }, { passive: true });
  const end = () => { if (!on) return; on = false; row.style.transform = ''; if (dx > 55) { setReply(m); if (navigator.vibrate) navigator.vibrate(15); } };
  row.addEventListener('touchend', end); row.addEventListener('touchcancel', end);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && replyTo) clearReply(); });

$('form').onsubmit = async e => {
  e.preventDefault(); const v = $('inp').value.trim(); if (!v || !cur) return; $('inp').value = '';
  /* criptografar antes de enviar */
  const encrypted = await E2E.encrypt(v, ME, cur);
  const rp = replyTo ? { ...replyTo, m: await E2E.encrypt(replyTo.m, ME, cur) } : null;
  const r = await Auth.chat.dmSend(ME, cur, encrypted, rp), eb = $('errBar'); checkOld();
  if (!r || !r.ok) { $('inp').value = v; eb.textContent = '⚠ Mensagem não enviada. ' + ((r && r.err) || 'Vocês ainda são amigos? Tente de novo.'); eb.classList.remove('hidden'); return; }
  eb.classList.add('hidden'); clearReply(); await loadMsgs(true);
};
function checkOld() { const o = $('oldBar'); o.textContent = '⚠ ' + Auth.chat.oldMsg; o.classList.toggle('hidden', !Auth.chat.old); }
async function refreshSummary() { summary = await Auth.chat.dmSummary(ME) || {}; renderList(); }

/* ---- início ---- */
renderList();
Auth.init().then(async () => {
  await refreshSummary(); Auth.pres.watch(() => Auth.friends(ME), () => { renderList(); if (cur) setStatus(lastSt, cur); });
  const u = new URLSearchParams(location.search).get('u'); if (u) openConv(u);
  setInterval(refreshSummary, 3000); setInterval(() => loadMsgs(false), 1200);
  if (Auth.server) setInterval(async () => { if (await Auth.sync()) renderList(); }, 2500);
});
addEventListener('storage', () => { refreshSummary(); loadMsgs(false); });
</script>
